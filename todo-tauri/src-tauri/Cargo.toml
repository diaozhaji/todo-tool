[package]
name = "todo-tool"
version = "1.0.0"
description = "待办清单桌面版（Tauri 2 + React）"
edition = "2021"

[lib]
name = "todo_tool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
